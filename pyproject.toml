[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webfetch-mcp"
version = "0.1.0"
description = "Lightweight web fetch MCP server with Chrome TLS fingerprint spoofing"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0.0",
    "curl-cffi>=0.7.0",
    "trafilatura>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
webfetch-mcp = "src.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
