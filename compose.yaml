services:
  webfetch-mcp:
    image: ghcr.io/suckerfish/webfetch-mcp:latest
    container_name: webfetch-mcp
    ports:
      - "${PORT:-8082}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
